name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CI: true
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Flet
        run: pip install flet==0.28.3

      - name: Build APK
        run: |
          flutter config --no-analytics
          # Фокус: команда yes будет бесконечно слать 'y' на любые вопросы Flet
          yes | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerTerminal-APK
          path: build/apk
          if-no-files-found: error
