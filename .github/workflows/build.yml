name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install Flet CLI
        run: uv pip install --system flet

      - name: Build APK
        run: |
          flet build apk --verbose
        env:
          FLET_CLI_NO_RICH_OUTPUT: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerTerminal-APK
          path: build/apk/*.apk
          if-no-files-found: error
